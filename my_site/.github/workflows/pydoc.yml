name: Generate Pydoc Documentation

on:
  push:
    branches:
      - main 

permissions:
  contents: write

jobs:
  pydoc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Django
        run: pip install django

      - name: Generate Pydoc HTML
        env:
          # Le decimos a Django dónde está la configuración de tu proyecto
          DJANGO_SETTINGS_MODULE: my_site.settings
        run: |
          mkdir docs
          python -m pydoc -w manage blog/views blog/urls
          mv *.html docs/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs