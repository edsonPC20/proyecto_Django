name: Generate Pydoc Documentation

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  pydoc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Django
        run: pip install django

      - name: Generate Pydoc HTML
        env:
          # Apunta a la configuración real respetando la doble carpeta
          DJANGO_SETTINGS_MODULE: my_site.settings
        run: |
          mkdir docs
          
          # 1. Entramos a la carpeta contenedora real de tu proyecto
          cd my_site
          
          # 2. Añadimos esta ruta al sistema para que Django no se pierda
          export PYTHONPATH=$PWD
          
          # 3. Ejecutamos Pydoc apuntando exactamente a tus archivos internos
          python -m pydoc -w manage blog/views.py blog/urls.py
          
          # 4. Movemos los archivos generados a la carpeta externa docs
          mv *.html ../docs/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
