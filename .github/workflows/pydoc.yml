name: Generate Pydoc Documentation

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  pydoc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Django
        run: pip install django

      - name: Generate Pydoc HTML
        env:
          # Le decimos a Django exactamente dónde está su archivo de configuración
          DJANGO_SETTINGS_MODULE: my_site.settings
        run: |
          mkdir docs
          
          # 1. Nos metemos en la carpeta contenedora donde está tu proyecto
          cd my_site
          
          # 2. Obligamos a Python a reconocer la carpeta actual para que no se líe
          export PYTHONPATH=$PWD
          
          # 3. Ejecutamos Pydoc usando rutas absolutas del sistema para tus archivos reales
          python -m pydoc -w manage ./blog/views.py ./blog/urls.py
          
          # 4. Sacamos los archivos HTML generados hacia la carpeta docs externa
          mv *.html ../docs/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
